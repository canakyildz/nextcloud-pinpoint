# Local development stack: Nextcloud 35 + Pinpoint running as a manual-install ExApp.
# Credentials here are throwaway development values. Never reuse them anywhere else.
#
#   make dev-up        start Nextcloud and install Tables, Assistant and the OpenAI/LocalAI integration
#   make dev-register  register Pinpoint with AppAPI (manual-install daemon)
#
# See docs/DEVELOPMENT.md for the full walkthrough.

name: pinpoint-dev

services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_TAG:-35-apache}
    ports:
      - "8080:80"
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud"
    volumes:
      - nextcloud:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/status.php | grep -q '\"installed\":true'"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Regular background jobs (the official image only runs cron if asked to).
  cron:
    image: nextcloud:${NEXTCLOUD_TAG:-35-apache}
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
    depends_on:
      nextcloud:
        condition: service_healthy

  # Runs AI tasks for synchronous providers (integration_openai) as soon as they are scheduled,
  # as recommended in the Nextcloud admin manual, instead of waiting for the next cron run.
  taskworker:
    image: nextcloud:${NEXTCLOUD_TAG:-35-apache}
    user: www-data
    entrypoint: ["sh", "-c", "while true; do php /var/www/html/occ background-job:worker -t 60 'OC\\TaskProcessing\\SynchronousBackgroundJob'; sleep 1; done"]
    volumes:
      - nextcloud:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nextcloud:
        condition: service_healthy

  pinpoint:
    build:
      context: ..
      target: dev
    depends_on:
      nextcloud:
        condition: service_healthy
    environment:
      APP_ID: pinpoint
      APP_DISPLAY_NAME: Pinpoint
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me-0123456789}
      APP_HOST: 0.0.0.0
      APP_PORT: "23000"
      APP_PERSISTENT_STORAGE: /data
      NEXTCLOUD_URL: http://nextcloud
    volumes:
      - ../ex_app/lib:/ex_app/lib
      - ../ex_app/js:/ex_app/js
      - ../ex_app/img:/ex_app/img
      - pinpoint-data:/data
    ports:
      - "23000:23000"

volumes:
  nextcloud:
  pinpoint-data:
